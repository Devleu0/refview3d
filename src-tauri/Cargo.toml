[package]
name = "refview3d"
version = "0.1.0"
description = "그림 레퍼런스용 경량 3D 뷰어"
authors = ["Devleu"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "refview3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
notify-debouncer-mini = "0.7.0"
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
